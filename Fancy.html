const SI_PREFIX = array<u32, 10>(

// ---------------- SHA-512 ----------------

fn add64(a: vec2<u32>, b: vec2<u32>) -> vec2<u32> {
  let lo = a.y + b.y;
  return vec2<u32>(a.x + b.x + select(0u, 1u, lo < a.y), lo);
}
// 0 < n < 32
fn rotr(a: vec2<u32>, n: u32) -> vec2<u32> {
  return vec2<u32>((a.x >> n) | (a.y << (32u - n)), (a.y >> n) | (a.x << (32u - n)));
}
// 32 < n < 64
fn rotrh(a: vec2<u32>, n: u32) -> vec2<u32> {
  let m = n - 32u;
  return vec2<u32>((a.y >> m) | (a.x << (32u - m)), (a.x >> m) | (a.y << (32u - m)));
}
fn shr(a: vec2<u32>, n: u32) -> vec2<u32> {
  return vec2<u32>(a.x >> n, (a.y >> n) | (a.x << (32u - n)));
}

fn k512(i: u32) -> vec2<u32> {
  return K512[i].xy;
}

fn sha512_block(st: ptr<function, array<vec2<u32>, 8>>, w: ptr<function, array<vec2<u32>, 16>>) {
  var a = (*st)[0]; var b = (*st)[1]; var c = (*st)[2]; var d = (*st)[3];
  var e = (*st)[4]; var f = (*st)[5]; var g = (*st)[6]; var h = (*st)[7];
  for (var i = 0u; i < 80u; i++) {
    var wi: vec2<u32>;
    if (i < 16u) {
      wi = (*w)[i];
    } else {
      let w15 = (*w)[(i + 1u) & 15u];
      let w2 = (*w)[(i + 14u) & 15u];
      let s0 = rotr(w15, 1u) ^ rotr(w15, 8u) ^ shr(w15, 7u);
      let s1 = rotr(w2, 19u) ^ rotrh(w2, 61u) ^ shr(w2, 6u);
      wi = add64(add64((*w)[i & 15u], s0), add64((*w)[(i + 9u) & 15u], s1));
      (*w)[i & 15u] = wi;
    }
    let S1 = rotr(e, 14u) ^ rotr(e, 18u) ^ rotrh(e, 41u);
    let ch = (e & f) ^ (~e & g);
    let t1 = add64(add64(h, S1), add64(add64(ch, k512(i)), wi));
    let S0 = rotr(a, 28u) ^ rotrh(a, 34u) ^ rotrh(a, 39u);
    let mj = (a & b) ^ (a & c) ^ (b & c);
    h = g; g = f; f = e; e = add64(d, t1);
    d = c; c = b; b = a; a = add64(t1, add64(S0, mj));
  }
  (*st)[0] = add64((*st)[0], a); (*st)[1] = add64((*st)[1], b);
  (*st)[2] = add64((*st)[2], c); (*st)[3] = add64((*st)[3], d);
  (*st)[4] = add64((*st)[4], e); (*st)[5] = add64((*st)[5], f);
  (*st)[6] = add64((*st)[6], g); (*st)[7] = add64((*st)[7], h);
}

fn sha512_iv() -> array<vec2<u32>, 8> {
  return array<vec2<u32>, 8>(
    vec2<u32>(0x6a09e667u, 0xf3bcc908u), vec2<u32>(0xbb67ae85u, 0x84caa73bu),
    vec2<u32>(0x3c6ef372u, 0xfe94f82bu), vec2<u32>(0xa54ff53au, 0x5f1d36f1u),
    vec2<u32>(0x510e527fu, 0xade682d1u), vec2<u32>(0x9b05688cu, 0x2b3e6c1fu),
    vec2<u32>(0x1f83d9abu, 0xfb41bd6bu), vec2<u32>(0x5be0cd19u, 0x137e2179u));
}

// HMAC: состояния после блока ключа (K0 ^ ipad) и (K0 ^ opad). key — 32 BE-слова (128 байт).
fn hmac_init(key: ptr<function, array<u32, 32>>, ist: ptr<function, array<vec2<u32>, 8>>, ost: ptr<function, array<vec2<u32>, 8>>) {
  var w: array<vec2<u32>, 16>;
  *ist = sha512_iv();
  for (var i = 0u; i < 16u; i++) {
    w[i] = vec2<u32>((*key)[2u * i] ^ 0x36363636u, (*key)[2u * i + 1u] ^ 0x36363636u);
  }
  sha512_block(ist, &w);
  *ost = sha512_iv();
  for (var i = 0u; i < 16u; i++) {
    w[i] = vec2<u32>((*key)[2u * i] ^ 0x5c5c5c5cu, (*key)[2u * i + 1u] ^ 0x5c5c5c5cu);
  }
  sha512_block(ost, &w);
}

// HMAC от 64-байтного сообщения (8 слов): 192 байта всего → длина 1536 бит.
fn hmac64(ist: ptr<function, array<vec2<u32>, 8>>, ost: ptr<function, array<vec2<u32>, 8>>, msg: ptr<function, array<vec2<u32>, 8>>) -> array<vec2<u32>, 8> {
  // sha512_m64 — развёрнутый вариант, генерируется в sha512-unrolled.js и дописывается к шейдеру
  return sha512_m64(*ost, sha512_m64(*ist, *msg));
}

fn put_byte(buf: ptr<function, array<u32, 32>>, pos: u32, b: u32) {
  (*buf)[pos >> 2u] |= (b & 0xffu) << (24u - 8u * (pos & 3u));
}

// ---------------- SHA-256 ----------------

fn rotr32(x: u32, n: u32) -> u32 { return (x >> n) | (x << (32u - n)); }

fn k256(i: u32) -> u32 { return K256[i >> 2u][i & 3u]; }

fn sha256_block(st: ptr<function, array<u32, 8>>, w: ptr<function, array<u32, 16>>) {
  var a = (*st)[0]; var b = (*st)[1]; var c = (*st)[2]; var d = (*st)[3];
  var e = (*st)[4]; var f = (*st)[5]; var g = (*st)[6]; var h = (*st)[7];
  for (var i = 0u; i < 64u; i++) {
    var wi: u32;
    if (i < 16u) {
      wi = (*w)[i];
    } else {
      let w15 = (*w)[(i + 1u) & 15u];
      let w2 = (*w)[(i + 14u) & 15u];
      let s0 = rotr32(w15, 7u) ^ rotr32(w15, 18u) ^ (w15 >> 3u);
      let s1 = rotr32(w2, 17u) ^ rotr32(w2, 19u) ^ (w2 >> 10u);
      wi = (*w)[i & 15u] + s0 + (*w)[(i + 9u) & 15u] + s1;
      (*w)[i & 15u] = wi;
    }
    let S1 = rotr32(e, 6u) ^ rotr32(e, 11u) ^ rotr32(e, 25u);
    let ch = (e & f) ^ (~e & g);
    let t1 = h + S1 + ch + k256(i) + wi;
    let S0 = rotr32(a, 2u) ^ rotr32(a, 13u) ^ rotr32(a, 22u);
    let mj = (a & b) ^ (a & c) ^ (b & c);
    h = g; g = f; f = e; e = d + t1;
    d = c; c = b; b = a; a = t1 + S0 + mj;
  }
  (*st)[0] += a; (*st)[1] += b; (*st)[2] += c; (*st)[3] += d;
  (*st)[4] += e; (*st)[5] += f; (*st)[6] += g; (*st)[7] += h;
}

fn sha256_iv() -> array<u32, 8> {
  return array<u32, 8>(0x6a09e667u, 0xbb67ae85u, 0x3c6ef372u, 0xa54ff53au,
                       0x510e527fu, 0x9b05688cu, 0x1f83d9abu, 0x5be0cd19u);
}

// ---------------- Поле GF(2^255 - 19): 16 лимбов по 16 бит ----------------

alias Fe = array<u32, 16>;

fn fe_carry(o: ptr<function, Fe>) {
  var c = 0u;
  for (var i = 0u; i < 16u; i++) {
    let v = (*o)[i] + c;
    (*o)[i] = v & 0xffffu;
    c = v >> 16u;
  }
  // 2^256 ≡ 38 (mod p)
  (*o)[0] += 38u * c;
  c = 0u;
  for (var i = 0u; i < 16u; i++) {
    let v = (*o)[i] + c;
    (*o)[i] = v & 0xffffu;
    c = v >> 16u;
  }
  (*o)[0] += 38u * c;
}

fn fe_mul(a: Fe, b: Fe) -> Fe {
  var r: array<u32, 32>;
  var clo = 0u;
  var chi = 0u;
  for (var k = 0u; k < 31u; k++) {
    var lo = clo;
    var hi = chi;
    let i0 = select(0u, k - 15u, k > 15u);
    let i1 = min(k, 15u);
    for (var i = i0; i <= i1; i++) {
      let p = a[i] * b[k - i];
      lo += p;
      hi += select(0u, 1u, lo < p);
    }
    r[k] = lo & 0xffffu;
    clo = (lo >> 16u) | (hi << 16u);
    chi = hi >> 16u;
  }
  r[31] = clo;
  var o: Fe;
  for (var i = 0u; i < 16u; i++) {
    o[i] = r[i] + 38u * r[i + 16u];
  }
  fe_carry(&o);
  return o;
}

fn fe_sq(a: Fe) -> Fe { return fe_mul(a, a); }

fn fe_sqn(a: Fe, n: u32) -> Fe {
  var t = a;
  for (var i = 0u; i < n; i++) { t = fe_mul(t, t); }
  return t;
}

fn fe_add(a: Fe, b: Fe) -> Fe {
  var o: Fe;
  for (var i = 0u; i < 16u; i++) { o[i] = a[i] + b[i]; }
  fe_carry(&o);
  return o;
}

// a - b; при уходе в минус результат «обёрнут» на 2^256 ≡ 38, поэтому вычитаем 38 ещё раз.
fn fe_sub(a: Fe, b: Fe) -> Fe {
  var o: Fe;
  var br = 0u;
  for (var i = 0u; i < 16u; i++) {
    let t = a[i] + 0x10000u - b[i] - br;
    o[i] = t & 0xffffu;
    br = 1u - (t >> 16u);
  }
  for (var ps = 0u; ps < 2u; ps++) {
    var sb = 38u * br;
    br = 0u;
    for (var i = 0u; i < 16u; i++) {
      let t = o[i] + 0x10000u - sb - br;
      o[i] = t & 0xffffu;
      br = 1u - (t >> 16u);
      sb = 0u;
    }
  }
  return o;
}

// Полное приведение в [0, p).
fn fe_canon(a: Fe) -> Fe {
  var v = a;
  for (var ps = 0u; ps < 2u; ps++) {
    var t: Fe;
    var c = 19u;
    for (var i = 0u; i < 16u; i++) {
      let s = v[i] + c;
      t[i] = s & 0xffffu;
      c = s >> 16u;
    }
    // если v + 19 ≥ 2^255, то v ≥ p и v - p = (v + 19) - 2^255
    if (c != 0u) {
      t[15] |= 0x8000u; // v + 19 = 2^256 + t → v - p = t + 2^255
      v = t;
    } else if ((t[15] & 0x8000u) != 0u) {
      t[15] &= 0x7fffu;
      v = t;
    }
  }
  return v;
}

fn fe_inv(z: Fe) -> Fe {
  let z2 = fe_sq(z);
  let z8 = fe_sqn(z2, 2u);
  let z9 = fe_mul(z8, z);
  let z11 = fe_mul(z9, z2);
  let z22 = fe_sq(z11);
  let z_5_0 = fe_mul(z22, z9);
  let z_10_0 = fe_mul(fe_sqn(z_5_0, 5u), z_5_0);
  let z_20_0 = fe_mul(fe_sqn(z_10_0, 10u), z_10_0);
  let z_40_0 = fe_mul(fe_sqn(z_20_0, 20u), z_20_0);
  let z_50_0 = fe_mul(fe_sqn(z_40_0, 10u), z_10_0);
  let z_100_0 = fe_mul(fe_sqn(z_50_0, 50u), z_50_0);
  let z_200_0 = fe_mul(fe_sqn(z_100_0, 100u), z_100_0);
  let z_250_0 = fe_mul(fe_sqn(z_200_0, 50u), z_50_0);
  return fe_mul(fe_sqn(z_250_0, 5u), z11);
}

fn load_fe(off: u32) -> Fe {
  var o: Fe;
  for (var i = 0u; i < 8u; i++) {
    let v = TABLE[off + i];
    o[2u * i] = v & 0xffffu;
    o[2u * i + 1u] = v >> 16u;
  }
  return o;
}

// ---------------- Основной конвейер ----------------

fn word_bits(w: ptr<function, array<u32, 5>>, off: u32) -> u32 {
  let i = off >> 5u;
  let s = off & 31u;
  var v = (*w)[i] << s;
  if (s != 0u) { v |= (*w)[i + 1u] >> (32u - s); }
  return v >> 21u;
}

@compute @workgroup_size(WG)
fn main(@builtin(global_invocation_id) gid3: vec3<u32>, @builtin(num_workgroups) nwg: vec3<u32>) {
  let gid = gid3.x + gid3.y * nwg.x * WG;
  if (gid >= P.count) { return; }

  // --- энтропия и чек-сумма BIP39 ---
  let e0 = P.base.x;
  let e1 = P.base.y;
  let e2 = P.base.z;
  let e3 = P.base.w ^ gid;
  var h256 = sha256_iv();
  var w32: array<u32, 16>;
  w32[0] = e0; w32[1] = e1; w32[2] = e2; w32[3] = e3; w32[4] = 0x80000000u;
  w32[15] = 128u;

  var key: array<u32, 32>;
  var pos = 0u;
  for (var k = 0u; k < 12u; k++) {
    let idx = word_bits(&ent, 11u * k);
    if (k > 0u) { put_byte(&key, pos, 0x20u); pos++; }

  var ist: array<vec2<u32>, 8>;

крывайте`,running:`Перебор идёт`,paused:`Пауза`,checked:`фраз проверено`,speed:`Скорость`,time:`Время`,eta:`Ориентир`,chance:`Шанс уже найти`,lastCandidate:`Последний кандидат`,randomNote:`Поиск случайный: может закончиться и раньше, и позже расчёта.`,pause:`Пауза`,resume:`Продолжить`,power:`Мощность`,stop:`Остановить`,notifyHint:`Когда адрес найдётся, прозвучит сигнал и появится уведомление (если браузер разрешит).`,foundTitle:`Нашли!`,foundSub:(e,t)=>`Адрес с «${e}» после ${t} попыток`,toClaim:`Оформить кошелёк`,searchAgain:`Искать ещё`,copyAddr:`Копировать адрес`,copied:`Скопировано`,waitTitle:`Сколько ждать на вашем устройстве`,waitSub:e=>`Медиана при текущей скорости ${e} фраз/с. В начале адреса — почти так же.`,chars:`Символов`,anyCase:`Любой регистр`,exactCase:`Точный регистр`,myTitle:`Мои адреса`,mySub:`Хранятся только в этом браузере. Пока ключ не сменён, первые 12 слов — единственный доступ к адресу.`,myEmpty:`Здесь появятся найденные адреса.`,status:{found:`найден`,funded:`пополнен`,switched:`готов к импорту`},open:`Открыть`,del:`Удалить`,delFound:`Удалить адрес? Если вы не записали 12 слов, он будет потерян навсегда.`,delDone:`Удалить запись с этого устройства? Убедитесь, что все 24 слова записаны.`,howTitle:`Как это работает`,howSub:`Шесть шагов от текста до красивого адреса в Telegram Wallet. Первые три происходят только на вашем компьютере.`,how:[[`Вы выбираете текст`,`Окончание, начало или оба сразу. Fancy мгновенно считает, сколько вариантов придётся перебрать и сколько это займёт именно на вашей видеокарте — ещё до запуска.`],[`Видеокарта ищет`,`Каждую секунду она создаёт сотни тысяч случайных фраз из 12 слов и для каждой вычисляет адрес Telegram Wallet. Как только адрес совпадает с вашим текстом — поиск останавливается и звучит сигнал.`],[`Вы записываете 24 слова`,`Найденные 12 слов задают адрес. Ещё 12 создаёт ваш браузер — это ваш будущий ключ. Вместе получается обычная фраза Telegram Wallet из 24 слов. Запишите её на бумаге.`],[`Пополняете на 0.1 GRAM`,`Адрес уже существует, но кошелька-контракта в блокчейне ещё нет. Отправьте на адрес 0.1 GRAM с любого кошелька — это активация. Сеть возьмёт около 0.001 GRAM комиссии, остальные ~0.099 GRAM останутся на вашем кошельке.`],[`Fancy меняет ключ`,`Одна транзакция разворачивает кошелёк и переключает его ключ на ваши 24 слова. Адрес остаётся прежним, а первые 12 слов сами по себе больше ничего не подписывают. Транзакцию видно в любом эксплорере.`],[`Импортируете в Wallet`,`Telegram → Wallet → «Импортировать кошелёк» → 24 слова по порядку. Проверьте, что адрес совпадает, — и пользуйтесь. Запись в Fancy после этого можно удалить.`]],factsTitle:`Почему это безопасно`,facts:[[`Без сервера`,`У Fancy нет бэкенда. В сеть уходит только подписанная транзакция смены ключа — через публичный toncenter.`],[`Проверяемо`,`После смены ключа публичный ключ кошелька равен ключу ваших 24 слов — это видно в любом эксплорере.`],[`Открытый контракт`,`Кошелёк — официальный контракт WalletTg от ton-blockchain. Слова 1–12 после смены ключа ничего не подписывают.`]],faqTitle:`Вопросы`,faq:[[`Почему это бесплатно, а vanity.tg берёт деньги?`,`Потому что мы на этом не зарабатываем. vanity.tg берёт плату за каждый найденный адрес — это его бизнес. Fancy делает то же самое прямо в вашем браузере, на вашей видеокарте, и денег не берёт. Платите только 0.1 GRAM за активацию кошелька — и те почти целиком остаются у вас.`],[`Зачем нужно пополнять адрес?`,`Найденный адрес — пока только вычисленное место в блокчейне. Сам кошелёк-контракт появляется после первой транзакции, а оплачивает её сам кошелёк. Поэтому сначала на него нужно отправить 0.1 GRAM. Комиссия сети — около 0.001 GRAM, остальное остаётся на вашем кошельке.`],[`Можно ли закрыть вкладку или свернуть окно во время поиска?`,`Свернуть окно или переключиться на другую вкладку можно — поиск продолжится. Закрывать вкладку нельзя: поиск остановится. Найденные адреса сохраняются, а начать заново не хуже — каждая попытка случайна, накопленный «прогресс» ничего не даёт.`],[`Подойдёт ли адрес для Tonkeeper, MyTonWallet и других кошельков?`,`Нет. Адрес вычислен для контракта Telegram Wallet (WalletTg), а Tonkeeper, MyTonWallet и другие используют контракты v4/v5 — по тем же 24 словам они покажут другой, пустой адрес. Импортируйте слова именно в Telegram → Wallet. Отправлять GRAM на ваш адрес можно из любого кошелька.`],[`Что будет, если я не записал слова?`,`Восстановить их нельзя — их нет ни у кого, кроме вашего браузера. Пока запись есть в «Мои адреса», слова можно посмотреть там. После удаления записи или очистки браузера доступ пропадёт навсегда.`],[`Можно ли доверять файлу?`,`Код открыт на GitHub. Fancy работает без сервера: в сеть уходит только подписанная транзакция смены ключа. Можно собрать файл из исходников самому и сравнить контрольную сумму с релизом.`]],footer:`Не аффилировано с Telegram. Telegram Wallet — продукт его правообладателя. Используйте на свой риск; начните с короткого текста и небольшой суммы.`,claimTitle:`Оформление кошелька`,collapse:`Свернуть`,s1:`Запишите 24 слова`,s1text:`Слова 1–12 нашёл поиск — они задают адрес. Слова 13–24 только что создал ваш браузер — на них переключится ключ. Запишите все 24 по порядку, на бумаге, без скриншотов.`,anchorLabel:`Слова 1–12 · задают адрес`,signingLabel:`Слова 13–24 · ваш ключ`,reveal:`Показать слова — убедитесь, что никто не смотрит`,copy24:`Скопировать 24 слова`,wrote:`Я записал все 24 слова по порядку`,s2:`Пополните адрес и смените ключ`,s2text:e=>`Отправьте <b>${e} GRAM</b> на найденный адрес из любого кошелька — это активация. Комиссия сети ≈ 0.001 GRAM, остальное останется на вашем кошельке.`,openWallet:`Открыть в кошельке`,balance:`Баланс`,contract:`контракт`,deployed:`развёрнут`,notDeployed:`ещё не развёрнут`,waitingFunds:`ждём пополнения…`,checkingChain:`Проверяем баланс…`,netError:e=>`Не удалось связаться с toncenter: ${e}. Повторим через несколько секунд.`,switchKey:`Сменить ключ на мои 24 слова`,sending:`Отправляем…`,sent:`Транзакция отправлена. Ждём подтверждения (обычно 5–20 секунд)…`,errPrefix:`Ошибка: `,errAnchor:`слова 1–12 не дают этот адрес — запись повреждена`,errForeignKey:`в контракте чужой ключ — продолжать нельзя`,errState:e=>`состояние аккаунта: ${e}`,errTimeout:`подтверждение не пришло за 2 минуты. Проверьте адрес в эксплорере и нажмите ещё раз`,s3:`Импорт в Telegram Wallet`,import1:`Telegram → Wallet → <b>Импортировать кошелёк</b>, 24 слова.`,import2:`Введите слова <b>в показанном порядке</b> — с 1 по 24.`,import3:e=>`Проверьте, что адрес в Wallet заканчивается на <b class="mono">${e}</b>.`,switchedOk:`Ключ сменён: публичный ключ кошелька совпадает с вашими 24 словами. Слова 1–12 сами по себе больше ничего не могут.`,explorer:`Посмотреть в эксплорере`,afterImport:`После импорта удалите запись в «Мои адреса» — так фраза не останется в этом браузере.`,stopError:e=>`Поиск остановлен: ${e}`,notifTitle:`Fancy: адрес найден`},Ra={ru:La,en:{langName:`EN`,source:`Source code`,channel:`Author’s channel`,badgeLocal:`100% local`,heroTitle:[`An address`,`worth showing off`],heroLead:`Fancy finds a Telegram Wallet address with your word in it — right on this computer. Your GPU checks hundreds of thousands of phrases per second, and all 24 words stay with you.`,heroPoints:[`No sign-up`,`No server at all`,`Open source`],price:[[`Search`,`free`],[`Wallet activation`,`0.1 GRAM`],[`Network fee`,`≈ 0.001 GRAM`]],priceNote:`You only pay for activation — and almost all of it stays in your new wallet.`,devChecking:`Preparing the GPU — up to 30 seconds on first run…`,devSelftest:e=>`Found ${e}. Cross-checking GPU results against the CPU…`,devBench:`Measuring your device speed…`,devGpu:`GPU`,devCpu:e=>`CPU · ${e} threads`,perSec:`phrases/s`,gpuUnavailable:e=>`GPU unavailable (${e}). Open the file in a recent Chrome or Edge — it is dozens of times faster.`,settings:`Search settings`,yourText:`Your text`,where:`Where`,atEnd:`At the end`,atStart:`At the start`,both:`Start + end`,gpuLoad:`GPU load`,powerNames:{.25:`Quiet`,.5:`Eco`,.75:`Recommended`,1:`Maximum`},powerNote:`The recommended mode leaves headroom — the card runs quieter and cooler, the search only slightly longer. Almost no VRAM is used: this percentage is what sets the load.`,waitBoth:`"Start + end" counts all characters together.`,caseLabel:`Case`,caseAny:`Any`,caseExact:`Exact`,popular:`Popular`,hintAny:`lucky, Lucky and LUCKY all match — much faster.`,hintExact:`Letters exactly as typed — each letter takes about twice as long.`,allowed:`Latin letters, digits, "-" and "_", up to 8 characters.`,err:{empty:`Type some text`,chars:`Only Latin letters, digits, "-" and "_"`,long:`At most 8 characters`,prefix3:`At the start, after "UQ" only A, B, C or D is possible`},attempts:`Attempts`,median:`Median`,oneIn20:`1 in 20 longer`,measuring:`measuring…`,longNote:`Long but doable: leave the computer on overnight or for a weekend. You can pause any time.`,tooLong:`Unrealistically long for this device — shorten the text or choose any case.`,feasibility:{fast:`seconds`,mid:`minutes`,slow:`hours`,long:`days`,insane:`forever`},etaSub:e=>`median, rarely up to ${e}`,etaInstant:`almost instant`,advanced:`Advanced`,network:`Network`,engine:`Compute on`,engineGpu:`GPU`,engineCpu:`CPU`,apiKey:`toncenter API key`,apiKeyPh:`optional — 1 request/s without a key`,start:`Start search`,waitBench:`Waiting for the speed test…`,localNote:`Everything runs on this device`,liveReady:`Ready to search`,liveNoGpu:`GPU required`,liveEta:`Time to find ≈`,liveElapsed:`Since start`,liveNotStarted:`not started`,back:`Back`,huntTitle:e=>`Hunting ${e}`,huntSub:e=>`${e} · you can minimize the window, keep the tab open`,running:`Searching`,paused:`Paused`,checked:`phrases checked`,speed:`Speed`,time:`Time`,eta:`Estimate`,chance:`Chance so far`,lastCandidate:`Last candidate`,randomNote:`The search is random: it may finish sooner or later than estimated.`,pause:`Pause`,resume:`Resume`,power:`Power`,stop:`Stop`,notifyHint:`When an address is found you will hear a sound and get a notification (if the browser allows).`,foundTitle:`Found it!`,foundSub:(e,t)=>`Address with "${e}" after ${t} attempts`,toClaim:`Set up the wallet`,searchAgain:`Search again`,copyAddr:`Copy address`,copied:`Copied`,waitTitle:`How long on your device`,waitSub:e=>`Median at the current speed of ${e} phrases/s. Prefixes take about the same.`,chars:`Chars`,anyCase:`Any case`,exactCase:`Exact case`,myTitle:`My addresses`,mySub:`Stored only in this browser. Until the key is switched, words 1–12 are the only access to the address.`,myEmpty:`Found addresses will appear here.`,status:{found:`found`,funded:`funded`,switched:`ready to import`},open:`Open`,del:`Delete`,delFound:`Delete this address? If you did not write down the 12 words it is lost forever.`,delDone:`Delete this record from the device? Make sure all 24 words are written down.`,howTitle:`How it works`,howSub:`Six steps from your text to a beautiful Telegram Wallet address. The first three happen only on your computer.`,how:[[`You pick the text`,`End, start or both. Fancy instantly calculates how many variants it has to try and how long that takes on your particular GPU — before you start.`],[`Your GPU searches`,`Every second it creates hundreds of thousands of random 12-word phrases and computes the Telegram Wallet address for each. As soon as one matches your text, the search stops and you hear a signal.`],[`You write down 24 words`,`The found 12 words define the address. Your browser creates 12 more — your future key. Together they make a regular 24-word Telegram Wallet phrase. Write it down on paper.`],[`You top up 0.1 GRAM`,`The address already exists, but the wallet contract is not on-chain yet. Send 0.1 GRAM from any wallet — that is the activation. The network takes about 0.001 GRAM in fees, the remaining ~0.099 GRAM stays in your wallet.`],[`Fancy switches the key`,`One transaction deploys the wallet and switches its key to your 24 words. The address stays the same, and words 1–12 alone can no longer sign anything. The transaction is visible in any explorer.`],[`You import into Wallet`,`Telegram → Wallet → "Import wallet" → the 24 words in order. Check that the address matches — done. You can delete the record in Fancy afterwards.`]],factsTitle:`Why it is safe`,facts:[[`No server`,`Fancy has no backend. Only the signed key-switch transaction goes out — via public toncenter.`],[`Verifiable`,`After the switch the wallet public key equals the key of your 24 words — visible in any explorer.`],[`Open contract`,`The wallet is the official WalletTg contract by ton-blockchain. After the switch words 1–12 sign nothing.`]],faqTitle:`FAQ`,faq:[[`Why is it free while vanity.tg charges?`,`Because we do not make money on it. vanity.tg charges for every address it finds — that is its business. Fancy does the same right in your browser, on your GPU, and charges nothing. You only pay 0.1 GRAM to activate the wallet — and almost all of it stays with you.`],[`Why do I need to top up the address?`,`A found address is just a computed spot on the blockchain. The wallet contract appears after the first transaction, and that transaction is paid by the wallet itself. So first send 0.1 GRAM to it. The network fee is about 0.001 GRAM, the rest stays in your wallet.`],[`Can I close the tab or minimize the window while searching?`,`Minimizing the window or switching tabs is fine — the search continues. Closing the tab stops it. Found addresses stay saved, and starting over is no worse — every attempt is random, accumulated "progress" means nothing.`],[`Will the address work in Tonkeeper, MyTonWallet and other wallets?`,`No. The address is computed for the Telegram Wallet contract (WalletTg), while Tonkeeper, MyTonWallet and others use v4/v5 contracts — the same 24 words would show a different, empty address there. Import the words into Telegram → Wallet. Anyone can send GRAM to your address from any wallet.`],[`What if I did not write the words down?`,`They cannot be recovered — nobody but your browser has them. While the record is in "My addresses" you can view the words there. After deleting the record or clearing the browser, access is lost forever.`],[`Can I trust the file?`,`The code is open on GitHub. Fancy has no server: only the signed key-switch transaction goes out. You can build the file from source yourself and compare the checksum with the release.`]],footer:`Not affiliated with Telegram. Telegram Wallet is a product of its respective owner. Use at your own risk; start with short text and a small amount.`,claimTitle:`Wallet setup`,collapse:`Collapse`,s1:`Write down 24 words`,s1text:`Words 1–12 come from the search — they define the address. Words 13–24 were just created by your browser — the key switches to them. Write all 24 in order, on paper, no screenshots.`,anchorLabel:`Words 1–12 · define the address`,signingLabel:`Words 13–24 · your key`,reveal:`Reveal the words — make sure nobody is watching`,copy24:`Copy 24 words`,wrote:`I wrote down all 24 words in order`,s2:`Top up and switch the key`,s2text:e=>`Send <b>${e} GRAM</b> to the found address from any wallet — that is the activation. The network fee is ≈ 0.001 GRAM, the rest stays in your wallet.`,openWallet:`Open in wallet`,balance:`Balance`,contract:`contract`,deployed:`deployed`,notDeployed:`not deployed yet`,waitingFunds:`waiting for funds…`,checkingChain:`Checking balance…`,netError:e=>`Could not reach toncenter: ${e}. Retrying in a few seconds.`,switchKey:`Switch the key to my 24 words`,sending:`Sending…`,sent:`Transaction sent. Waiting for confirmation (usually 5–20 seconds)…`,errPrefix:`Error: `,errAnchor:`words 1–12 do not produce this address — the record is corrupted`,errForeignKey:`the contract holds someone else’s key — cannot continue`,errState:e=>`account state: ${e}`,errTimeout:`no confirmation within 2 minutes. Check the address in an explorer and press again`,s3:`Import into Telegram Wallet`,import1:`Telegram → Wallet → <b>Import wallet</
